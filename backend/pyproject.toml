[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-workbench-backend"
version = "0.1.0"
description = "Local pilot API for the Retention Campaign Workbench"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "joblib==1.5.3",
  "jsonschema==4.26.0",
  "openai==3.0.0",
  "pandas==3.0.5",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.20",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "scikit-learn==1.9.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
addopts = "--strict-config --strict-markers"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
