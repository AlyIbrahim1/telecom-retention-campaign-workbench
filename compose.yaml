name: retention-workbench

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-11000000}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_PATH: ${MODEL_PATH:-/workspace/models/random_forest_churn_bundle.joblib}
      MODEL_SHA256: ${MODEL_SHA256:?Set MODEL_SHA256 in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-20}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-600}
      CHAT_CONTEXT_MESSAGES: ${CHAT_CONTEXT_MESSAGES:-20}
      CHAT_CONFIRMATION_TTL_SECONDS: ${CHAT_CONFIRMATION_TTL_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models/random_forest_churn_bundle.joblib:/workspace/models/random_forest_churn_bundle.joblib:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres_data:
